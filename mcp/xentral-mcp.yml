notes: Xentral publishes a hosted, official MCP server as part of Xentral AgentOS. The Claude Code plugin
  (xentral-connector, marketplace xentral/agent-library) declares the HTTP MCP endpoint; the endpoint
  answered an MCP initialize POST with HTTP 200 on 2026-07-21. Authentication is per-tenant via a browser
  OAuth-style sign-in on first use. Xentral also open-sourced a standalone, self-hostable MCP server (shiplabel-mcp)
  for carrier-agnostic shipping labels, with the same engine hosted as the Carrier Kit in AgentOS starter
  kits.
server:
