      operationId: storageLocations.setTotalStock
      summary: Set total stock on storage locations
      description: 'This endpoint sets the total stock for one or more storage locations.<br>The stock data provided in the payload, including quality control attributes (batch, best-before date, and serial number), will be taken over as the new stock for the specified storage location(s).<br><br><strong>CAUTION: Any stock that was previously present in the storage location and is not specified in the payload will be removed from the storage location. This also includes the quality control attributes.</strong>'
      requestBody:
        description: Overwrite stock for given products and storage Location
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      storageLocation:
                        type: object
                        properties:
                          id:
                            type: string
                            pattern: \d+
                            example: '17'
                            description: Resource identifier.
                      totalStock:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            product:
                              type: object
                              properties:
                                id:
                                  type: string
                                  pattern: \d+
                                  example: '17'
                                  description: Resource identifier.
                            quantity:
                              type: number
                            qualityControlAttributes:
                              type: object
                              properties:
                                batch:
