                                      - primary
                                      description: The palette value of the tag
                                      example: default
                                    isOfficial:
                                      type: boolean
                                      description: Whether the tag is used for official Xentral reports
                                      example: true
                                    createdAt:
                                      example: '2023-01-01T00:00:00+00:00'
