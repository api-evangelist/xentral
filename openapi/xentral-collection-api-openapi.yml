                                  createdAt: '2023-01-01T00:00:00+00:00'
                                  updatedAt: '2023-01-01T00:00:00+00:00'
                                items:
                                  type: object
                                  additionalProperties: false
                                  required:
                                  - id
                                  - name
                                  properties:
                                    id:
                                      type: number
                                      description: Tag ID
                                      example: 1
                                    name:
                                      type: string
                                      description: Tag name
                                      example: Official
                                    description:
                                      type: string
                                      description: Tag description
                                      example: This is my tag
                                    palette:
                                      type: string
                                      enum:
                                      - default
