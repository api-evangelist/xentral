        description: Filter parameters
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                enum:
                - id
                - taxTypeId
                - countryCode
                - productId
                - productCategoryId
                - isActive
                - createdAt
                - updatedAt
                example: id
