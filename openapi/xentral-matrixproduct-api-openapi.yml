                    properties:
                      id:
                        type: string
                        pattern: \d+
                        example: '17'
                        description: Resource identifier.
                      name:
                        type: string
                        description: Name of the value.
                        example: Sample name
                      sort:
                        description: This value sorts the resource
                        type: number
                        example: 1
                    example:
                      id: '123456'
                      name: Sample name
                      sort: 1
              examples:
                Shows information about a single value from an option of a matrix product:
                  value:
                    data:
                      id: '1'
                      name: blue
                      sort: 1
        '401':
          description: Unable to authenticate the client
          content:
            application/json:
              schema:
                type: object
                properties:
