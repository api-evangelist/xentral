  /api/v1/products/{productId}/options/{optionId}/values/{id}:
    get:
      tags:
      - Matrixproduct
      operationId: product.viewValue
      summary: View product option value
      description: Returns details of a single value from an option of a matrix product.
      parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
        description: Product ID of the matrix product.
      - in: path
        name: optionId
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
        description: Option ID from the value it belongs to.
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
