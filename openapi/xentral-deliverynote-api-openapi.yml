                      id:
                        description: ID of the product
                        type: string
                        example: '13'
                    type: object
                  quantity:
                    description: Quantity of the line item.
                    type: number
                    format: float
                    exclusiveMinimum: 0
                    example: 10.5
                  name:
                    description: Line item name. If not provided, the product name will be used.
                    type: string
                    maxLength: 255
                    example: Product X
                  description:
                    description: Line item description. If not provided, the product description will be used.
                    type: string
                    example: Description of Product X
                  countryOfOrigin:
                    description: Country of origin for the product. If not provided, the product's country of origin will be used.
                    type: string
                    maxLength: 128
                    example: DE
