openapi: 3.2.0
info:
  title: Xentral Business Documents API v3 Product Delivery…
  description: '**This is a preliminary version of the Xentral Business Documents API v3.**


    It is not yet complete, specifications may change without prior notice. Please use it with caution and report any issues you find'
  contact:
    name: API Support
    url: https://xentral.com
    email: api@xentral.com
  version: 0.2.0
servers:
- url: https://{xentralId}.xentral.biz
  description: Your xentral instance
  variables:
    xentralId:
      default: my-company
      description: Your Xentral instance ID
- url: https://{domain}
  description: Xentral with a custom domain
  variables:
    domain:
      default: demo.xentral.com
      description: Your Xentral custom domain
security:
- BearerAuth: []
tags:
- name: ProductDeliveryThreshold
  description: ProductDeliveryThreshold
paths:
  /api/v3/products/{productId}/deliveryThresholds:
    post:
      tags:
      - ProductDeliveryThreshold
      summary: Create product delivery threshold V3
      description: 'This endpoint requires the following scopes: `deliveryThreshold:create`.


        Create a product delivery threshold.'
      operationId: POST::api-v3-products-productid-deliverythresholds
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Data for creating a new product delivery threshold
              required:
              - recipientCountry
              - taxRate
              properties:
                recipientCountry:
                  description: Recipient country code in ISO 3166-1 alpha-2 format (uppercase)
                  type: string
                  maxLength: 2
                  pattern: ^[A-Z]{2}$
                  example: AT
                taxRate:
                  description: Tax rate to be applied for this product and country
                  type: number
                  format: float
                  minimum: 0
                  example: 7.02
                comment:
                  description: Optional comment or note about the threshold
                  type: string
                  maxLength: 255
                  example: Special tax rate for Austria
                revenueAccount:
                  description: Optional revenue account code to be used for this threshold
                  type: string
                  maxLength: 11
                  example: ABC123
                active:
                  description: Whether the threshold is active. Defaults to false.
                  type: boolean
                  default: false
                  example: true
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Create a product delivery threshold.
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: Product delivery threshold rule
                    required:
                    - id
                    - recipientCountry
                    - taxRate
                    - active
                    properties:
                      id:
                        description: The unique identifier of the product delivery threshold rule
                        type: string
                        example: '1'
                      recipientCountry:
                        description: Recipient country code in ISO 3166-1 alpha-2 format
                        type: string
                        example: AT
                      taxRate:
                        description: Tax rate for this product and country combination
                        type: number
                        format: float
                        example: 7.02
                      comment:
                        description: Optional comment about the threshold rule
                        type:
                        - string
                        - 'null'
                        example: Special tax rate for Austria
                      revenueAccount:
                        description: Optional revenue account code
                        type:
                        - string
                        - 'null'
                        example: ABC123
                      active:
                        description: Whether the threshold rule is active
                        type: boolean
                        example: true
                    type: object
                    additionalProperties: false
                type: object
        '400':
          description: Failed validation
          content:
            application/problem+json:
              schema:
                properties:
                  type:
                    description: Error messages
                    type: string
                    example: https://api.xentral.biz/problems/request-validation
                  title:
                    description: Error messages
                    type: string
                    example: Request payload validation failed.
                  violations:
                    description: Error messages
                    type: object
                    example:
                      recipientCountry:
                      - The recipient country field is required.
                      taxRate:
                      - The tax rate field is required.
                      comment:
                      - The comment field must be a string.
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                properties:
                  message:
                    description: Too Many Requests
                    type: string
                    example: Too Many Requests
                type: object
      x-scopes:
      - deliveryThreshold:create
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
