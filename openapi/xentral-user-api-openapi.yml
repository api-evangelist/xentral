  /api/v1/users/{id}:
    get:
      tags:
      - User
      operationId: user.view
      summary: View user
      description: Returns details of a single user
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      responses:
        '200':
          description: A single user resource.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    description: User resource.
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - username
                    - description
                    - createdAt
                    properties:
                      id:
                        type: string
                        pattern: \d+
                        example: '17'
                        description: Resource identifier.
