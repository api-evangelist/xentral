        description: ID of warehouse
        required: true
        schema:
          type: number
      - name: storageLocationId
        in: path
        description: ID of storage location
        required: true
        schema:
          type: number
      requestBody:
        description: Add item to Storage Location payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - product
              - quantity
              properties:
                product:
                  required:
                  - sku
                  type: object
                  properties:
                    sku:
                      type: string
                      description: SKU code of the item
                quantity:
                  type: number
                  description: Quantity of the item to stock to storage location
                batch:
                  type: string
                  description: Batch to assign the stock update to
                bestBeforeDate:
                  type: string
                  format: date
                  description: Best Before Date to assign to the stock units added
                serialNumbers:
                  type: array
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                        description: The serial number of the item
                reason:
                  type: string
                  description: Reason for adding to the stock
                project:
                  required:
                  - id
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      description: Id of the project
            examples:
              Add stock to storage location:
                value:
                  product:
                    sku: '10840'
                  quantity: 1
              Add stock to storage location (batch and best before date):
                value:
                  product:
                    sku: '10038'
                  quantity: 5
                  batch: '123456'
                  bestBeforeDate: '2027-01-01'
              Add stock to storage location (serial numbers):
                value:
                  product:
                    sku: '10440'
                  quantity: 3
                  serialNumbers:
                  - number: '2000482'
                  - number: '2000483'
                  - number: '2000484'
