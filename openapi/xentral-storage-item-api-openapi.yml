openapi: 3.0.0
info:
  title: Xentral Account Storage Item API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Storage Item
  description: Represent a storage item in a storage location
paths:
  /api/v1/warehouses/{warehouseId}/storageLocations/{storageLocationId}/items:
    get:
      tags:
      - Storage Item
      deprecated: true
      operationId: storage_item.list
      parameters:
      - name: warehouseId
        in: path
        description: ID of warehouse
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      - name: storageLocationId
        in: path
        description: ID of storage location
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      - name: filter
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                enum:
                - productId
              op:
                type: string
                enum:
                - greaterThan
                - lessThan
                - equals
                - notEquals
                - in
                - notIn
                - lessThanOrEquals
                - greaterThanOrEquals
              value:
                oneOf:
                - type: string
                  description: Product ID value.
                  title: String
                - type: array
                  description: Used for the operations 'in', 'notIn'.
                  title: Array
                  items:
                    type: string
      summary: List storage items V1
      description: 'Returns all storage location items for the specified warehouse / location. If no Accept header is provided, or if Accept: application/json is specified, the response format is identical to version 2.'
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/vnd.xentral.default.v1-beta+json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    description: Representation of a list of Items in storage
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        product:
                          description: Information from the Product in storage
                          required:
                          - sku
                          type: object
                          properties:
                            sku:
                              type: string
                              description: SKU code of the item
                          example:
                            sku: ABC-12345-S-BL
                        quantity:
                          type: number
                          description: Quantity of the item to stock to storage location
                          example: 5
                        batches:
                          type: array
                          items:
                            type: string
                          description: Batches of the items
                          example:
                          - Batch1
                        bestBeforeDates:
                          type: array
                          items:
                            type: string
                          description: Best before dates of the items
                          example:
                          - '2023-01-01 00:00:00'
                        serialNumbers:
                          type: array
                          items:
                            type: object
                            properties:
                              number:
                                type: string
                                description: The serial number of the items
                          description: The serial number list of the items
                          example:
                          - number: '001'
                          - number: '002'
                    example:
                    - id: '1'
                      product:
                        sku: ABC-12345-S-BL
                      quantity: 3
                      batches:
                      - Batch1
                      - Batch2
                      bestBeforeDates:
                      - '2025-01-01 00:00:00'
                      serialNumbers:
                      - number: '001'
                      - number: '002'
                      - number: '003'
        '400':
          description: IETF RFC 9457 Problem API compliant response
          content:
            application/problem+json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - violations
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/request-validation
                    title:
                      type: string
                      minLength: 1
                      example: Request payload validation failed.
                    violations:
                      oneOf:
                      - type: array
                        items:
                          type: object
                          example:
                            username:
                            - This value should not be blank.
                            email:
                            - This value is not a valid email address.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                      - type: object
                        example:
                          _:
                          - This value should contain at most `9` elements.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/generic-validation
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: array
                      items:
                        type: string
                - type: object
