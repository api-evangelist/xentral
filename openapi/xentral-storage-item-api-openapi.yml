  /api/v2/warehouses/{warehouseId}/storageLocations/{storageLocationId}/items:
    get:
      tags:
      - Storage Item
      operationId: storageLocation.listV2
      parameters:
      - name: warehouseId
        in: path
        description: ID of warehouse
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      - name: storageLocationId
        in: path
        description: ID of storage location
        required: true
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      summary: List storage items V2
      description: Returns all storage location items for the specified warehouse / location.
      responses:
        '200':
          description: Operation completed successfully. Support for products where a product is both serial number tracked AND batch/best before date tracked at the same time is limited. In case serial number tracking is set to "Generate own" in the product master data, the qualityControlAttribute quantities will be reported (a) for the serial numbers on shelf and (b) for the batch/bestBeforeDate records on shelf, thus potentially resulting in a double count in the total across all qualityControlAttribute->quantity values. The quantity on the product->quantity level reflects the correct quantity on shelf in any case.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    description: Representation of a list of Items in storage
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        productId:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        sku:
                          type: string
                          description: SKU code of the item
                          example: ABC-12345-S-BL
                        quantity:
                          type: number
                          description: Quantity of the item to stock to storage location
                          example: 5
                        qualityControlAttributes:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              quantity:
                                type: number
                                description: Quantity of the item to stock to storage location
                              batch:
                                type: string
                                nullable: true
                                description: Batch of the item
                              bestBeforeDate:
                                type: string
                                format: date
                                nullable: true
                                description: Best before date of the item
                              serialNumbers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    number:
                                      type: string
                                      description: The serial numbers of the item
                          description: List of Product unit specific quality properties
                          example:
                          - quantity: 5
                            batch: Batch1
