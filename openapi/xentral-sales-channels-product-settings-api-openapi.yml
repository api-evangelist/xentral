openapi: 3.0.0
info:
  title: Xentral Account Sales Channels Product Settings API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Sales Channels Product Settings
  description: Sales Channel Settings inside a product.
paths:
  /api/v1/products/{id}/salesChannels:
    post:
      tags:
      - Sales Channels Product Settings
      operationId: product.createSalesChannels
      summary: Create product sales channel settings
      description: Creates sales channel settings for a single product.
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                salesChannel:
                  description: Reference to another resource
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                isActive:
                  type: boolean
                  description: Determines if the sales channel connection is active.
                  example: true
                useIndividualSalesChannelSettings:
                  type: boolean
                  description: Determines if the individual sales channel settings should be used instead of the general sales channel settings.
                  example: true
                isStockNumberSyncActive:
                  type: boolean
                  description: Determines if the stock number synchronization to the sales channel is active.
                  example: true
                isRemainingQuantity:
                  type: boolean
                  description: Determines if only the remaining quantity of the product is left.
                  example: true
                suggestedRetailPrice:
                  type: string
                  description: Sets the suggested retail price for the sales channel.
                  example: '25.99'
                suggestedStockQuantity:
                  type: string
                  description: Sets the suggested stock quantity for the sales channel.
                  example: '100'
                deliveryTime:
                  type: string
                  description: Sets the delivery time.
                  example: 1 week
                handlingTime:
                  type: string
                  pattern: ^(0|[1-9]\d*)$
                  description: Sets the handling time in days for this product. Must be a non-negative integer. This value is only relevant for Amazon sales channels; other sales channels ignore this field.
                  example: '5'
                createNewProductDuringImport:
                  type: boolean
                  description: Determines if a new product should be created during the sales order import from a sales channel.
                  example: true
            examples:
              example:
                value:
                  salesChannel:
                    id: '1'
                  isActive: true
                  useIndividualSalesChannelSettings: false
                  isStockNumberSyncActive: true
                  isRemainingQuantity: false
                  suggestedRetailPrice: '29.99'
                  suggestedStockQuantity: '100'
                  deliveryTime: 3-5 business days
                  handlingTime: '5'
                  createNewProductDuringImport: true
      responses:
        '201':
          description: Resource successfully created response
          headers:
            Location:
              schema:
                type: string
                example: https://example.xentral.biz/api/users/17
              description: URI of the created resource
          content:
