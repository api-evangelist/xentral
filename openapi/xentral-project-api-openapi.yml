openapi: 3.0.0
info:
  title: Xentral Account Project API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Project
  description: Project resource.
paths:
  /api/v1/projects:
    get:
      tags:
      - Project
      operationId: Project.list
      summary: List projects
      description: Returns a collection of projects
      parameters:
      - in: query
        name: page
        required: false
        style: deepObject
        schema:
          type: object
          additionalProperties: false
          required:
          - number
          - size
          properties:
            number:
              type: string
              pattern: \d+
              description: Page number should be an integer greater than or equal to 1
            size:
              type: string
              pattern: \d+
              description: Page size should usually be an integer between 10 and 50.
      - name: filter
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                enum:
                - search
                - id
                - name
                - keyName
                - description
                - currency
                - normalTaxRate
                - reducedTaxRate
                - storageProcess
                - pickingProcess
              op:
                type: string
                enum:
                - equals
                - notEquals
                - in
                - notIn
                - exactlyIn
                - allIn
                - allNotIn
                - contains
                - notContains
                - startsWith
                - endsWith
                - greaterThan
                - lessThan
                - is
                - lessThanOrEquals
                - greaterThanOrEquals
              value:
                oneOf:
                - type: string
                  description: Used for the operations 'equals', 'notEquals', 'contains', 'notContains', 'startsWith', 'endsWith' and 'is'.
                  title: String
                - type: array
                  description: Used for the operations 'in', 'notIn', 'exactlyIn', 'allIn' and 'allNotIn'.
                  title: Array
                  items:
                    type: string
      - name: order
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                - id
                - name
                - keyName
                - description
                - currency
                - normalTaxRate
                - reducedTaxRate
                - storageProcess
                - pickingProcess
              dir:
                type: string
                enum:
                - asc
                - desc
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        name:
                          x-description-missing: true
                          type: string
                          example: Berlin Project
                        keyName:
                          x-description-missing: true
                          type: string
                          example: BER_PROJ_001
                        description:
                          x-description-missing: true
                          type: string
                          example: A project based in Berlin focusing on software development and integration.
                        currency:
                          x-description-missing: true
                          type: string
                          example: EUR
                        normalTaxRate:
                          x-description-missing: true
                          type: number
                          format: float
                          example: 13.3
                        reducedTaxRate:
                          x-description-missing: true
                          type: number
                          format: float
                          example: 13.3
                        storageProcess:
                          x-description-missing: true
                          type: string
                          enum:
                          - none
                          - order
                          - orderPointOfSale
                          example: order
                        pickingProcess:
                          x-description-missing: true
                          type: string
                          enum:
                          - invoiceMail
                          - shipmentNote
                          - shipmentNoteScan
                          - shipmentNoteWarehouse
                          - shipmentNoteWarehouseScan
                          - twoLevel
                          example: invoiceMail
                        defaultCustomerPaymentMethod:
                          type: object
                          nullable: true
                          description: Default payment method used for customers in this project
                          example:
                            id: '13'
                            type: paypal
                            designation: Paypal
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            type:
                              type: string
                              description: Type of the payment method
                              example: paypal
                            designation:
                              type: string
                              description: Name of the payment method
                              example: Paypal
                        defaultSupplierPaymentMethod:
                          type: object
                          nullable: true
                          description: Default payment method used for suppliers in this project
                          example:
                            id: '13'
                            type: paypal
                            designation: Paypal
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            type:
                              type: string
                              description: Type of the payment method
                              example: paypal
                            designation:
                              type: string
                              description: Name of the payment method
                              example: Paypal
                        defaultShippingMethod:
                          type: object
                          nullable: true
                          description: Default shipping method used for this project
                          example:
                            id: '10'
                            type: Go
                            designation: GO!
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            type:
                              type: string
                              description: Type of the shipping method
                              example: Go
                            designation:
                              type: string
                              description: Name of the shipping method
                              example: GO!
                        freeFields:
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              value:
                                type: string
                            required:
                            - id
                            - value
                          example:
                          - id: '1'
                            value: test
                          - id: '2'
                            value: test1
                          - id: '3'
                            value: ''
                  extra:
                    type: object
                    required:
                    - totalCount
                    - page
                    additionalProperties: false
                    x-description-ignore: true
                    properties:
                      totalCount:
                        description: the total count of all items
                        type: integer
                        example: 1
                      page:
                        description: The pagination object containing the current page number and size
                        type: object
                        required:
                        - number
                        - size
                        additionalProperties: false
                        properties:
                          number:
                            description: The current page number
                            type: integer
                            example: 1
                          size:
                            description: The size of the pages
                            type: integer
                            example: 10
                        example:
                          number: 1
                          size: 10
                    example:
                      totalCount: 1
                      page:
                        number: 1
                        size: 10
              example:
                data:
                - id: '91'
                  name: Standard - 1
                  keyName: STANDARD1
                  description: This is a standard project
                  currency: EUR
                  normalTaxRate: 19
                  reducedTaxRate: 7
                  storageProcess: none
                  pickingProcess: twoLevel
                  defaultCustomerPaymentMethod:
                    id: '13'
                    type: paypal
                    designation: Paypal
                  defaultSupplierPaymentMethod:
                    id: '13'
                    type: paypal
                    designation: Paypal
                  defaultShippingMethod:
                    id: '10'
                    type: Go
                    designation: GO!
                  freeFields:
                  - id: '1'
                    value: test
                  - id: '2'
                    value: test1
                  - id: '3'
                    value: ''
                  - id: '4'
                    value: ''
                  - id: '5'
                    value: ''
                  - id: '6'
                    value: ''
                  - id: '7'
                    value: test7
                  - id: '8'
                    value: ''
                  - id: '9'
                    value: ''
                  - id: '10'
                    value: ''
                - id: '92'
                  name: Standard - 2
                  keyName: STANDARD2
                  description: This is a standard project
                  currency: CH
                  normalTaxRate: 20
                  reducedTaxRate: 10
                  storageProcess: order
                  pickingProcess: shipmentNote
                  defaultCustomerPaymentMethod:
                    id: '13'
                    type: paypal
                    designation: Paypal
                  defaultSupplierPaymentMethod:
                    id: '13'
                    type: paypal
                    designation: Paypal
                  defaultShippingMethod:
                    id: '10'
                    type: Go
                    designation: GO!
                  freeFields:
                  - id: '1'
                    value: test
                  - id: '2'
                    value: test1
                  - id: '3'
                    value: ''
                  - id: '4'
                    value: ''
                  - id: '5'
                    value: ''
                  - id: '6'
                    value: ''
                  - id: '7'
                    value: test7
                  - id: '8'
                    value: ''
                  - id: '9'
                    value: ''
                  - id: '10'
                    value: ''
                extra:
                  totalCount: 2
                  page:
                    number: 1
                    size: 10
        '403':
          description: Unable to authorize the client
        '406':
          description: Requested resource representation does not exist.
        '429':
          description: Too many API calls made.
