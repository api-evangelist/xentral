      responses:
        '200':
          description: Update an invoice.
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: Invoice document
                    type: object
                    allOf:
                    - properties:
                        id:
                          description: ID of the document
                          type: string
                          example: '1'
                        documentNumber:
                          description: Document number. For drafts, this will be null.
                          type:
                          - string
                          - 'null'
                          example: I-12343
                        documentDate:
                          description: Main date of the document.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2023-10-01'
                        writeProtection:
                          description: Indicates if the document is write protected.
                          type: boolean
                          example: false
                        customerNumber:
                          description: Customer number of the document.
                          type:
                          - string
                          - 'null'
                          example: CUST-54321
                        address:
                          description: Address entity of the document. By default, only the ID is returned. To get the full Address object, use the `include` parameter.
                          anyOf:
                          - required:
                            - id
                            - createdAt
                            - updatedAt
                            properties:
                              id:
                                type: string
                                example: '42'
                              isDeleted:
                                description: Flagged if the entry was deleted.
                                type: boolean
                                example: false
                              createdAt:
                                description: Creation timestamp
                                type: string
                                format: date-time
                                example: '2025-03-15T09:27:00+01:00'
                              updatedAt:
                                description: Last update timestamp
                                type: string
                                format: date-time
                                example: '2025-10-20T14:45:12+01:00'
                            type: object
                            additionalProperties: false
                          - properties:
                              id:
                                type: string
                            type: object
                          - type: 'null'
                        project:
                          description: Project entity of the document. By default, only the ID is returned. To get the full Project object, use the `include` parameter.
                          anyOf:
                          - required:
                            - id
                            - name
                            - abbreviation
                            properties:
                              id:
                                type: string
                                example: '54'
                              name:
                                type: string
                                example: Standard Project
                              abbreviation:
                                type: string
                                example: STANDARD
                            type: object
                            additionalProperties: false
                          - properties:
                              id:
                                type: string
                            type: object
                          - type: 'null'
                        tags:
                          description: Tags assigned to the document. This property is only returned if the `tags` include is used.
                          type: array
                          items:
                            properties:
                              id:
                                description: ID of the tag
                                type: string
                                example: '4'
                              title:
                                description: Title of the tag
                                type: string
                                example: important
                            type: object
                        documentAddress:
                          description: The recipients postal address of the document. This is is usually the postal address of the document's address entitiy, (e.g. customer), or is populated based on the preceding document. As this address is persisted on the document level, it can however be modified independently, and does not reflect changes that occurred since the document was created.
                          required:
                          - name
                          properties:
                            name:
                              description: 'Represents an address consisting of a physical address and contact information.

                                It is used in various documents, such as invoices, delivery notes, etc.'
                              type: string
                              example: John
                            type:
                              type:
                              - string
                              - 'null'
                              enum:
                              - mrs
                              - mr
                              - company
                              - other
                              example: mr
                            title:
                              type:
                              - string
                              - 'null'
                              example: Ms.
                            contactPerson:
                              type:
                              - string
                              - 'null'
                              example: Laura Schneider
                            department:
                              type:
                              - string
                              - 'null'
                              example: Research & Development
                            subDepartment:
                              type:
                              - string
                              - 'null'
                              example: AI Lab
                            addressSupplement:
                              type:
                              - string
                              - 'null'
                              example: Gebäude B, 4. Etage
                            street:
                              type:
                              - string
                              - 'null'
                              example: Fuggerstraße 11
                            zipCode:
                              type:
                              - string
                              - 'null'
                              example: '86150'
                            city:
                              type:
                              - string
                              - 'null'
                              example: Augsburg
                            state:
                              type:
                              - string
                              - 'null'
                              example: BY
                            country:
                              type:
                              - string
                              - 'null'
                              example: DE
                            salutation:
                              type:
                              - string
                              - 'null'
                              example: Sehr geehrte Damen und Herren
                            gln:
                              type:
                              - string
                              - 'null'
                              example: '1234567890123'
                            email:
                              type:
                              - string
                              - 'null'
                              example: laura.schneider@xentral.com
                            phone:
                              type:
                              - string
                              - 'null'
                              example: +1-234-567-8900
                            fax:
                              type:
                              - string
                              - 'null'
                              example: +1-234-567-8901
                            mobile:
                              type:
                              - string
                              - 'null'
                              example: +1-234-567-8902
                          type: object
                          example:
                            name: John
                            type: mr
                            title: Ms.
                            contactPerson: Laura Schneider
                            department: Research & Development
                            subDepartment: CAI Lab
                            addressSupplement: Gebäude B, 4. Etage
                            street: Fuggerstraße 11
                            zipCode: '86150'
                            city: Augsburg
                            state: BY
                            country: DE
                            salutation: Sehr geehrte Damen und Herren
                            gln: '1234567890123'
                            email: alice@example.com
                            phone: +1-234-567-8900
                            fax: +1-234-567-8901
                            mobile: +1-234-567-8902
                          additionalProperties: false
                        internalDesignation:
                          description: Internal designation, might be displayed in the letterhead.
                          type:
                          - string
                          - 'null'
                          example: FB-3860-L
                        isDocumentSent:
                          description: Indicates if the document has been sent to the recipient.
                          type: boolean
                          example: false
                        language:
                          description: ISO 639-1 Language of the document.
                          type: string
                          example: de
                        bodyIntroduction:
                          description: Text displayed on the document before the line items.
                          type:
                          - string
                          - 'null'
                          example: Dear customer, we are pleased to send you the following invoice.
                        bodyOutroduction:
                          description: Text displayed on the document after the line items.
                          type:
                          - string
                          - 'null'
                          example: Thank you for your business.
                        vatId:
                          description: VAT ID of the document.
                          type:
                          - string
                          - 'null'
                          example: DE123456789
                        deliveryTerms:
                          description: Delivery terms of the document.
                          type:
                          - string
                          - 'null'
                          example: DDP
                        internalComment:
                          description: Internal comment, does not show up on the document. Intended to be used for company-internal notes.
                          type:
                          - string
                          - 'null'
                          example: This is an internal comment.
                        editor:
                          properties:
                            id:
                              description: ID of the user who is responsible for the document.
                              type: string
                              example: '4'
                          type:
                          - object
                          - 'null'
                        printSettings:
                          properties:
                            withoutLetterhead:
                              description: For PDFs or physical documents, hide the letterhead
                              type: boolean
                              example: false
                            withoutProductText:
                              description: For PDFs or physical documents, hide the product text
                              type: boolean
                              example: false
                          type: object
                        activity:
                          description: Activity log entries associated with the document. To get activity object, use the `include` parameter.
                          type: array
                          items:
                            required:
                            - message
                            - causer
                            - causedAt
                            properties:
                              message:
                                type: string
                                example: Invoice released
                              causer:
                                type:
                                - string
                                - 'null'
                                example: John Doe
                              causedAt:
                                type: string
                                format: date-time
                                example: '2023-01-01T00:00:00Z'
                            type: object
                            additionalProperties: false
                        customFields:
                          description: Custom fields with their values and metadata
                          type: array
                          items:
                            properties:
                              key:
                                type: string
                                example: customField1
                              value:
                                type:
                                - string
                                - 'null'
                                example: prospect
                              label:
                                type: string
                                example: lifecycle
                            type: object
                          example:
                          - key: customer_category
                            value: Premium
                            label: Customer Category
                          - key: priority_level
                            value: High
                            label: Priority Level
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2023-10-01T12:00:00Z'
                        createdAt:
                          type: string
                          format: date-time
                          example: '2023-10-01T12:00:00Z'
                      type: object
                    - properties:
                        financials:
                          description: Financials properties of the document
                          properties:
                            paymentMethod:
                              description: Payment method of the document. This is a reference to the payment method used for the document.
                              properties:
                                id:
                                  type: string
                                  example: '1'
                              type:
                              - object
                              - 'null'
                            paymentTerms:
                              description: Payment terms of the document
                              properties:
                                paymentTargetDays:
                                  type: integer
                                  example: 30
                                paymentTargetDiscount:
                                  type: number
                                  format: float
                                  example: 2.5
                                paymentTargetDiscountDays:
                                  type: integer
                                  example: 10
                              type: object
                            tax:
                              description: Tax properties of the document
                              properties:
                                taxation:
                                  description: Taxation of the document, e.g. "domestic" or "eu".
                                  type: string
                                  enum:
                                  - domestic
                                  - eu
                                  - export
                                  - exempt
                                  example: domestic
                                disableTaxNotice:
                                  description: Indicates if the tax notice should be disabled for this document.
                                  type: boolean
                                  example: false
                                taxRates:
                                  description: Tax rates of the document. These values cannot be edited directly via the Xentral UI, and are set based on the tax settings and the delivery or billing region.
                                  properties:
                                    standard:
                                      type: number
                                      format: float
                                      example: 19
                                    reduced:
                                      type: number
                                      format: float
                                      example: 7
                                  type: object
                              type: object
                            currency:
                              description: Currency of the document as an ISO 4217 code, e.g. "EUR" or "USD".
                              type:
                              - string
                              - 'null'
                              example: EUR
                            exchangeRate:
                              description: Per-document exchange rate snapshot. `null` means the document type does not carry a per-document exchange rate (e.g. purchase orders, proforma invoices); `0` means the document type supports it but no override is set — the system falls back to the global currency exchange table; any other value is the document-specific override.
                              type:
                              - number
                              - 'null'
                              format: float
                              example: 1.0875
                          type: object
                        totals:
                          description: Totals of the document. These values cannot be set directly, but are calculated based on the line items
                          properties:
                            net:
                              oneOf:
                              - description: Money
                                properties:
                                  amount:
                                    oneOf:
                                    - type: string
                                    - type: number
                                  currency:
                                    description: Currency
                                    type: string
                                    example: EUR
                                type: object
                                example:
                                  amount: '13.37'
                                  currency: EUR
                                additionalProperties: false
                              - type: 'null'
                            gross:
                              oneOf:
                              - description: Money
                                properties:
                                  amount:
                                    oneOf:
                                    - type: string
                                    - type: number
                                  currency:
                                    description: Currency
                                    type: string
                                    example: EUR
                                type: object
                                example:
                                  amount: '13.37'
                                  currency: EUR
                                additionalProperties: false
                              - type: 'null'
                            contributionMargin:
                              description: Contribution margin of the document.
                              type: number
                              format: float
                              example: 42
                          type: object
                      type: object
                    - properties:
                        salesOrder:
                          description: Sales order reference.
                          properties:
                            id:
                              description: ID of the sales order
                              type: string
                              example: '13'
                          type:
                          - object
                          - 'null'
                      type: object
                    - properties:
                        deliveryNote:
