                          type:
                          - string
                          - 'null'
                          example: PO-12345
                        deliveryDate:
                          description: Delivery date of the invoice. This is the date when the goods or services were delivered.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2023-10-15'
                        deviatingDebtorAccountNumber:
