                                example: John Doe
                              causedAt:
                                type: string
                                format: date-time
                                example: '2023-01-01T00:00:00Z'
                            type: object
                            additionalProperties: false
                        customFields:
                          description: Custom fields with their values and metadata
                          type: array
                          items:
                            properties:
                              key:
                                type: string
                                example: customField1
                              value:
                                type:
                                - string
                                - 'null'
                                example: prospect
                              label:
                                type: string
                                example: lifecycle
                            type: object
                          example:
                          - key: customer_category
                            value: Premium
                            label: Customer Category
                          - key: priority_level
                            value: High
                            label: Priority Level
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2023-10-01T12:00:00Z'
                        createdAt:
                          type: string
                          format: date-time
                          example: '2023-10-01T12:00:00Z'
                      type: object
                    - properties:
