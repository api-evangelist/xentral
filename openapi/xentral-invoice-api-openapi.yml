  /api/v1/invoices/{id}:
    get:
      tags:
      - Invoice
      operationId: invoice.view
      summary: View invoice
      description: Returns details of a single invoice.
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    x-description-missing: true
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        pattern: \d+
                        example: '17'
                        description: Resource identifier.
                      documentNumber:
                        x-description-missing: true
                        type: string
                        nullable: true
                        example: '1200132'
                      documentDate:
                        x-description-missing: true
                        type: string
                        format: date-time
                        example: '2022-01-07T00:00:00+01:00'
                      log:
                        x-description-missing: true
                        type: object
                        nullable: true
                        additionalProperties: false
                        required:
                        - createdAt
                        - createdBy
                        - sentAt
                        - sentBy
                        - updatedAt
                        properties:
                          createdAt:
                            type: string
                            format: date-time
                            example: '2022-01-07T13:43:12+01:00'
                          createdBy:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            nullable: true
                            properties:
                              name:
                                type: string
                            example:
                              name: John Doe
                          sentAt:
                            type: string
                            format: date-time
                            nullable: true
                            example: '2022-01-07T13:43:12+01:00'
                          sentBy:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            nullable: true
                            properties:
                              name:
                                type: string
                            example:
                              name: John Doe
                          updatedAt:
                            type: string
                            format: date-time
                            example: '2022-03-31T00:16:03+02:00'
                        example:
                          createdAt: '2022-01-07T13:43:12+01:00'
                          sentAt: null
                          createdBy:
                            name: John Doe
                          sentBy:
                            name: John Doe
                          updatedAt: '2022-03-31T00:16:03+02:00'
                      amountGross:
                        x-description-missing: true
                        type: number
                        format: float
                        example: 49.99
                      amountNet:
                        x-description-missing: true
                        type: number
                        format: float
                        example: 42.01
                      costCenter:
                        x-description-missing: true
                        type: string
                        example: '3456'
                      status:
                        x-description-missing: true
                        type: string
                        enum:
                        - created
                        - released
                        - sent
                        - canceled
                        - completed
                        - partialCancellation
                        - unknown
                        example: sent
                      project:
                        x-description-missing: true
                        type: object
                        additionalProperties: false
                        nullable: true
                        required:
                        - id
                        - name
                        - abbreviation
                        properties:
                          id:
                            type: string
                            pattern: \d+
                            example: '17'
                            description: Resource identifier.
                          name:
                            type: string
                          abbreviation:
                            type: string
                        example:
                          id: '6'
                          name: Shopware
                          abbreviation: B2C-SW
                      customer:
