                                  type:
                                    type: string
                                    enum:
                                    - product
                                    example: product
                                  id:
                                    description: ID of the line item.
                                    type: string
                                    example: '1'
                                  number:
                                    description: The Number of the line item. Usually the product SKU, but can be adjusted if required.
                                    type:
                                    - string
                                    - 'null'
                                    example: 2462-SK-D
                                  name:
                                    description: The name of the line item. Usually the product name, but can be adjusted if required.
                                    type: string
                                    example: Strawberry Jam
                                  description:
                                    description: The description of the line item. Usually the product description, but can be adjusted if required.
                                    type:
                                    - string
                                    - 'null'
                                    example: Delicious strawberry jam made from fresh strawberries.
                                  quantity:
                                    description: The quantity of the line item.
                                    type: number
                                    format: float
                                    example: 2
                                  product:
                                    description: The product of the line item.
                                    anyOf:
                                    - required:
                                      - id
                                      - number
                                      properties:
                                        id:
                                          type: string
                                        number:
                                          type:
                                          - string
                                          - 'null'
                                        createdAt:
                                          description: Creation timestamp
                                          type: string
                                          format: date-time
                                          example: '2025-03-15T09:27:00+01:00'
                                        updatedAt:
                                          description: Last update timestamp
                                          type: string
                                          format: date-time
                                          example: '2025-10-20T14:45:12+01:00'
                                      type: object
                                    - properties:
                                        id:
                                          type: string
                                          example: '3'
                                      type: object
                                  countryOfOrigin:
                                    description: The country of origin for the line item.
                                    type:
                                    - string
                                    - 'null'
                                  hsCode:
                                    description: The HS code for the line item.
                                    type:
                                    - string
                                    - 'null'
                                  customFields:
                                    description: Custom fields with their values and metadata.
                                    type: array
                                    items:
                                      properties:
                                        key:
                                          type: string
                                          example: customField1
                                        value:
                                          type:
                                          - string
                                          - 'null'
                                          example: prospect
                                        label:
                                          type: string
                                          example: lifecycle
                                      type: object
                                    example:
                                    - key: customer_category
                                      value: Premium
                                      label: Customer Category
                                    - key: priority_level
                                      value: High
                                      label: Priority Level
                                  unit:
                                    description: The unit of the line item.
                                    type:
                                    - string
                                    - 'null'
                                    example: kg
                                  deliveryDate:
                                    description: The delivery date of the line item.
                                    type:
                                    - string
                                    - 'null'
                                    format: date
                                  deliveryDateAsCalendarWeek:
                                    description: Whether to show the delivery date as calendar week or explicit.
                                    type: boolean
                                    default: false
                                  packagingUnit:
                                    description: The unit of packaging for the line item.
                                    type:
                                    - string
                                    - 'null'
                                    example: box
                                  internalComment:
                                    description: Internal comment, does not show up on the document. Intended to be used for company-internal notes.
                                    type:
                                    - string
                                    - 'null'
                                    example: This is an internal comment.
                                  customerProductNumber:
                                    description: Customer product number for the line item.
                                    type:
                                    - string
                                    - 'null'
                                    example: CUS-10077
                                  order:
                                    description: The ordering sequence of the line item.
                                    type: integer
                                    example: 5
                                  updatedAt:
                                    description: The date and time when the line item was last updated.
                                    type: string
                                    format: date-time
                                    example: '2023-10-01T12:00:00Z'
                                  createdAt:
                                    description: The date and time when the line item was created.
                                    type: string
                                    format: date-time
                                    example: '2023-10-01T12:00:00Z'
                                type: object
                              - properties:
                                  taxRate:
                                    description: Tax rate type applied to this line item
                                    oneOf:
                                    - type: string
                                      enum:
                                      - standard
