                          description: VAT ID of the document.
                          type:
                          - string
                          - 'null'
                          example: DE123456789
                        deliveryTerms:
                          description: Delivery terms of the document.
                          type:
                          - string
                          - 'null'
                          example: DDP
                        internalComment:
                          description: Internal comment, does not show up on the document. Intended to be used for company-internal notes.
