                  value:
                    data:
                    - id: '5'
                      name: Candy
                      parent:
                        id: '3'
                        name: Food
                    - id: '3'
                      name: Food
                      parent: null
                    - id: '4'
                      name: Gardening
                      parent: null
                    - id: '6'
                      name: Plants
                      parent:
                        id: '4'
                        name: Gardening
