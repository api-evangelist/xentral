                      storageLocation:
                        id: location-1
                      qualityControlAttributes:
                        quantity: 2.5
                        batch: Batch-123
                        bestBeforeDate: '2025-01-01'
                        serialNumbers:
                        - number: SN-123456789
      responses:
        '201':
          description: Resource successfully created response
