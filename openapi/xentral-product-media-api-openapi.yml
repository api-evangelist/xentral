          application/json:
            schema:
              type: object
              properties:
                product:
                  description: Reference to another resource
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                keyword:
                  type: string
                  enum:
                  - defaultImage
                  - printImage
                  - labelImage
                  - otherImage
                fileName:
                  type: string
                fileContent:
                  type: string
                  description: A base64 encoded image. Supported image formats JPEG, PNG
                  format: byte
            examples:
              Create product media:
                value:
                  product:
                    id: '52'
                  title: Product image
                  description: Product image
                  keyword: defaultImage
                  fileName: sample.png
                  fileContent: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVQYV2NgYAAAAAMAAWgmWQ0AAAAASUVORK5CYII=
