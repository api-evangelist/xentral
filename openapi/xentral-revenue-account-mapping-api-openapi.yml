openapi: 3.0.0
info:
  title: Xentral Account Revenue Account Mapping API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Revenue Account Mapping
  description: Revenue Account Mapping configurations
paths:
  /api/v1/revenueAccountMapping:
    post:
      tags:
      - Revenue Account Mapping
      operationId: revenueAccountMapping.create.v1
      summary: 🔒 Create revenue account mapping
      description: 'This endpoint is currently in Beta and available for testing. It may contain bugs, and breaking changes can occur at any time without prior notice. We do not recommend using Beta endpoints in production environments. Should you choose to use it in production, you assume full responsibility for any resulting issues.


        Create revenue account mapping'
      requestBody:
        description: Create a revenue account mapping object
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - accountId
              properties:
                accountId:
                  type: string
                deliveryCountryCode:
                  type: string
                projectId:
                  type: string
                productId:
                  type: string
                warehouseId:
                  type: string
                isActive:
                  type: boolean
            examples:
              revenue account mapping:
                value:
                  accountId: '1'
                  deliveryCountryCode: DE
                  projectId: '1'
                  productId: '1'
                  warehouseId: '1'
                  isActive: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Revenue account mapping entry
                properties:
                  id:
                    description: Revenue account mapping ID
                    type: string
                    example: '1'
                  accountId:
                    description: Account ID
                    type: string
                    example: '1000'
                  name:
                    description: Name of the mapping
                    type: string
                    example: Mapping Rule 1
                  deliveryCountryCode:
                    description: Delivery country code
                    type: string
                    example: DE
                  projectId:
                    description: Project ID
                    type: string
                    nullable: true
                    example: '1'
                  productId:
                    description: Product ID
                    type: string
                    nullable: true
                    example: '1'
                  warehouseId:
                    description: Warehouse ID
                    type: string
                    nullable: true
                    example: '1'
                  warehouseCountryCode:
                    description: Warehouse country code
                    type: string
                    nullable: true
                    example: DE
                  isActive:
                    description: Is active
                    type: boolean
                    example: true
                  createdAt:
                    description: Created at timestamp
                    type: string
                    format: date-time
                    example: '2022-01-01T00:00:00Z'
                  updatedAt:
                    description: Updated at timestamp
                    type: string
                    format: date-time
                    example: '2022-01-01T00:00:00Z'
                example:
                  id: '1'
                  accountId: '1000'
                  deliveryCountryCode: DE
                  projectId: '1'
                  productId: '1'
                  warehouseId: '1'
                  warehouseCountryCode: DE
