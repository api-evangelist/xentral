                  type: boolean
                  example: true
                hideInBulkPriceListing:
                  description: Whether to hide the price from bulk price listing
                  type: boolean
                  example: false
                remark:
                  description: Remark
                  type: string
                  example: remark example
                validFrom:
                  description: Valid from date
                  type: string
                  format: date
                  example: '2025-01-01'
                expiresAt:
                  description: Expires at date
                  type: string
                  format: date
                  example: '2025-01-01'
              type: object
