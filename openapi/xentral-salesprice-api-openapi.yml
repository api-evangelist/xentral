                          properties:
                            id:
                              description: Customer group ID
                              type: string
                              pattern: '[0-9]+'
                          type:
                          - object
                          - 'null'
                          example:
                            id: '1337'
                        price:
                          description: Money
                          properties:
                            amount:
                              oneOf:
                              - type: string
                              - type: number
                            currency:
                              description: Currency
                              type: string
                              example: EUR
                          type: object
                          example:
                            amount: '13.37'
                            currency: EUR
                          additionalProperties: false
                        amount:
                          description: Amount
                          type: number
                          format: float
                          example: 13.37
                        packageAmount:
                          description: Package amount
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 13.37
                        customerProductNumber:
                          description: Customer product number
                          type:
                          - string
                          - 'null'
                          example: Number1
                        isNotCalculatedFromExchangeTable:
                          description: Whether is calculated from exchange table
                          type: boolean
                          example: true
                        hideInBulkPriceListing:
                          description: Whether to hide from bulk price listing
                          type: boolean
                          example: false
                        remark:
                          description: Remark
                          type:
                          - string
                          - 'null'
                          example: remark example
                        validFrom:
                          description: Valid from date
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2025-01-01'
                        expiresAt:
                          description: Expires at date
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2025-01-01'
                      type: object
                    x-description-ignore: true
                    x-example-ignore: true
