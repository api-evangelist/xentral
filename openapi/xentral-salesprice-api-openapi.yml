        style: deepObject
        schema:
          type: array
          items:
            properties:
              key:
                type: string
                enum:
                - id
                - product.id
                - customer.id
                - group.id
                - currency
                - amount
                - remark
                - validFrom
                - expiresAt
                - createdAt
                - updatedAt
              op:
                description: operator
                type: string
                enum:
                - equals
                - notEquals
                - in
                - notIn
                - contains
                - notContains
                - startsWith
                - endsWith
                - greaterThan
                - lessThan
                - lessThanOrEquals
                - greaterThanOrEquals
              value:
                description: The property value.
                oneOf:
                - title: String
                  type: string
                - title: Array
                  type: array
                  items:
                    type: string
            type: object
            additionalProperties: false
      - name: sort
        in: query
        description: Sort via id, -id, amount, -amount, createdAt, -createdAt, updatedAt and -updatedAt. Default sort is -created_at
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            enum:
            - id
            - -id
            - amount
            - -amount
            - createdAt
            - -createdAt
            - updatedAt
            - -updatedAt
      - name: perPage
        in: query
        description: 'Number of items per page. Default: 15, Max: 100'
        required: false
        schema:
          type: integer
          example: 15
      - name: page
        in: query
        description: Page number.
        required: false
        schema:
          type: integer
          example: 1
      responses:
