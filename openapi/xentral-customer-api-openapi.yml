    patch:
      tags:
      - Customer
      operationId: customer.update.v2
      summary: Update customer
      description: Update an existing customer.
      parameters:
      - in: path
        name: id
        required: true
        description: The customer's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      requestBody:
        description: Request structure to update a customer
        content:
          application/json:
            schema:
              type: object
              properties:
                customerType:
                  type: string
                  nullable: true
                  description: Discriminator to create a company. If 'company' is used then 'name' is required. If 'person' is used then 'firstname' and 'lastname' are required.
                  enum:
                  - person
                  - company
                firstname:
                  type: string
                  nullable: true
                  description: Firstname of customer
                  example: Max
                lastname:
                  type: string
                  nullable: true
                  description: Lastname of customer
                  example: Mustmermann
                name:
                  type: string
                  nullable: true
                  description: Name of the company
                  example: General Cosmic Company
                title:
                  type: string
                  nullable: true
                  description: Title prefix for customer name. It will be used for communication.
                  example: Prof. Dr.
                birthdate:
                  type: string
                  format: date
                  nullable: true
                  description: Birhtdate of customer
                  example: '2024-03-01'
                number:
                  type: string
                  nullable: true
                  description: Customer number. if this is not provided default number ranges will be applied automatically
                  example: C700001
                deviatingCustomerNumber:
                  type: string
                  nullable: true
                  description: Deviating Customer number.
                  example: C711223
                salutation:
                  type: string
                  enum:
                  - mr
                  - mrs
                  - company
                  - other
                  nullable: true
                  description: Decide kind of person if necessary. This value is e.g. responsible to apply automatic rules for salutation
                  example: mr
                salutationPhrase:
                  type: string
                  nullable: true
                  description: You can specify a salutation how a customer/company should be addressed and override automatic rules.
                  example: Dear Sir
                department:
                  type: string
                  nullable: true
                  description: Specify a department for customer
                  example: Sales
                subDepartment:
                  type: string
                  nullable: true
                  description: Specify a sub-department for customer
                  example: Onlines Sales
                contactDetails:
                  type: object
                  additionalProperties: false
                  description: Contact information of a customer
                  properties:
                    phone:
                      type: string
                      nullable: true
                      description: Phone number of a customer
                      example: +49(30)12093756
                    mobile:
                      type: string
                      nullable: true
                      description: Mobile number of a customer
                      example: +49(172)56565656
                    fax:
                      type: string
                      nullable: true
                      description: Fax number of a customer
                      example: +49(30)12093756-1
                    email:
                      type: string
                      nullable: true
                      description: Email address of a customer
                      example: customer@domain.tpl
                    website:
                      type: string
                      nullable: true
                      description: URL of customers website
                    additionalData:
                      type: array
                      description: List of additional not default contact data
                      items:
                        type: object
                        additionalProperties: false
                        nullable: true
                        required:
                        - label
                        - value
                        properties:
                          label:
                            type: string
                            description: Specific key for customer contact data
                            example: mobile2
                          value:
                            type: string
                            nullable: true
                            description: Value for specified customers contact data key
                            example: +1(800)555 12235
                accountManager:
                  type: object
                  additionalProperties: false
                  nullable: true
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                salesManager:
                  type: object
                  additionalProperties: false
                  nullable: true
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                isLead:
                  type: boolean
                  nullable: false
                  description: Decides if customer is a lead
                  example: true
                contactPerson:
                  type: string
                  nullable: true
                  description: Name of contact person
                  example: Milo Thatch
                groups:
                  type: array
                  nullable: true
                  description: Specify the list of groups the customer should belong to
                  items:
                    type: integer
                    description: ID of the group
                customFields:
                  type: array
                  description: List of custom field values
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - value
                    properties:
                      id:
                        type: integer
                        nullable: false
                        description: 'Identifier of custom field (max range: 1-20)'
                        example: 1
                      value:
                        type: string
                        nullable: true
                        description: Value of custom field
                        example: HS Deal - Open
                financials:
                  type: object
                  additionalProperties: false
                  description: Financial information of a customer
                  properties:
                    tax:
                      type: object
                      additionalProperties: false
                      description: Tax information
                      properties:
                        taxation:
                          type: string
                          enum:
                          - domestic
                          - eu-delivery
                          - export
                          - free
