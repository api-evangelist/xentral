                    paymentTerms:
                      type: object
                      additionalProperties: false
                      description: Payment terms
                      properties:
                        fixedPaymentTerms:
                          type: boolean
                          description: Fixed payment terms
                          example: true
                        paymentTargetDays:
                          type: integer
                          nullable: true
                          description: Payment terms target in days
                          example: 14
                        paymentTargetDiscount:
                          type: number
                          nullable: false
                          description: Payment terms target discount
                          example: 25.95
                        paymentTargetDiscountDays:
                          type: integer
                          nullable: true
                          description: Payment terms discount days
                          example: 7
                    paymentMethod:
                      type: object
                      additionalProperties: false
                      nullable: true
                      required:
                      - id
                      properties:
