                        amountNet: 85.34
                        cashRegisterId: 5
                        customerId: '36'
                        createdAt: '2020-09-23T14:20:08+02:00'
                        createdBy: John Doe
                        businessTransactionType: ''
                        salesOrder:
                          id: '4'
                          number: '200001'
                          externalOrderNumber: ''
                        qrString: null
                  extra:
                    type: object
                    required:
                    - totalCount
                    - page
                    additionalProperties: false
                    x-description-ignore: true
                    properties:
                      totalCount:
                        description: the total count of all items
                        type: integer
                        example: 1
                      page:
                        description: The pagination object containing the current page number and size
                        type: object
                        required:
                        - number
                        - size
                        additionalProperties: false
                        properties:
                          number:
                            description: The current page number
                            type: integer
                            example: 1
                          size:
                            description: The size of the pages
                            type: integer
                            example: 10
                        example:
                          number: 1
                          size: 10
                    example:
                      totalCount: 1
                      page:
                        number: 1
                        size: 10
        '401':
          description: Unable to authenticate the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message explaining why the request failed.
                    example: 'Missing required scopes: customer:create.'
              example:
                message: 'Missing required scopes: customer:create.'
            text/html:
              schema:
                type: string
                example: Unauthorized
        '403':
          description: Unable to authorize the client
        '406':
          description: Requested resource representation does not exist.
        '429':
          description: Too many API calls made.
  /api/v1/posJournals/actions/add:
    post:
      tags:
      - Point Of Sale
      operationId: journal.add
      summary: Add journal entry
      description: Add a new journal entry.
      parameters: []
      requestBody:
        description: Add journal entry
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - project
              - cashier
              - transaction
              - entry
              - payment
              properties:
                project:
                  description: Reference to another resource
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                cashier:
                  description: Reference to another resource
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                transaction:
                  type: object
                  additionalProperties: false
                  required:
                  - type
                  - text
                  properties:
                    type:
                      type: string
                      nullable: false
                    text:
                      type: string
                      nullable: false
                entry:
                  oneOf:
                  - type: object
                    additionalProperties: false
                    nullable: false
                    required:
                    - type
                    - timestamp
                    - document
                    properties:
                      type:
                        type: string
                        enum:
                        - invoice
                        - credit_note
                        nullable: false
                      timestamp:
                        description: a atom formatted date time
                        type: string
                        format: date-time
                        example: '2023-08-13T14:45:36+02:00'
                      document:
                        type: object
                        description: When `entry.type` is `creditNote`, credit note ID will be provided. When `type` is `invoice`the invoice ID will be provided
                        additionalProperties: false
                        required:
                        - id
                        properties:
                          id:
                            type: string
                            pattern: \d+
                            example: '17'
                            description: Resource identifier.
                      qrString:
                        type: string
                        description: When `entry.type` is `invoice` or `credit_note` a string representing the QR code will be provided
                        additionalProperties: false
                  - type: object
                    additionalProperties: false
                    nullable: false
                    required:
                    - type
                    - timestamp
                    - amount
                    properties:
                      type:
                        type: string
                        enum:
                        - cash_in
                        - cash_out
                        - cash_difference
                        nullable: false
                      timestamp:
                        type: string
                        format: date-time
                        nullable: false
                      amount:
                        type: object
                        description: 'Mandatory field when `entry.type` has one of the values: `cash_in`, `cash_out`, `cash_difference`.'
                        additionalProperties: false
                        required:
                        - amount
                        - currency
                        properties:
                          amount:
                            type: string
                            format: float
                          currency:
                            type: string
                            pattern: '[A-Z]{3}'
                            enum:
                            - EUR
                            - PLN
                            - CHF
                            - USD
                            - GBP
                            description: Currency matches one of currency values as specified in ISO-4217.
                payment:
                  type: object
                  additionalProperties: false
                  nullable: false
                  required:
                  - type
                  properties:
                    type:
                      type: string
                      enum:
                      - cash
                      - ec
                      - credit
                      - ec_card
                      nullable: false
                fiscalDocumentReference:
                  description: This field represents an object with dynamic structure
                  type: object
                  additionalProperties: true
                  nullable: true
            examples:
              Add journal entry:
                value:
                  project:
                    id: '2'
                  cashier:
                    id: '4'
                  transaction:
                    type: invoice
                    text: Invoice 123
                  entry:
                    type: invoice
