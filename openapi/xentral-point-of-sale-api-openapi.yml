  /api/v1/posJournals:
    get:
      tags:
      - Point Of Sale
      operationId: journal.list
      summary: List POS journals
      description: Lists all active POS journals.
      parameters:
      - name: filter
        in: query
        style: deepObject
        schema:
          oneOf:
          - type: object
            additionalProperties: false
            properties:
              id:
                type: array
                items:
                  type: string
                  pattern: \d+
                  example: '17'
                  description: Resource identifier.
          - type: array
            items:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  enum:
                  - id
                  - date
                  - customerId
                  - projectId
                  - salesOrderId
                  - externalOrderNumber
                op:
                  type: string
                  enum:
                  - equals
                  - notEquals
                  - in
                  - notIn
                  - allIn
                  - allNotIn
                  - contains
                  - notContains
                  - startsWith
                  - endsWith
                  - greaterThan
                  - lessThan
                value:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
      - in: query
        name: page
        required: false
        style: deepObject
        schema:
          type: object
          additionalProperties: false
          required:
          - number
          - size
          properties:
            number:
              type: string
              pattern: \d+
              description: Page number should be an integer greater than or equal to 1
            size:
              type: string
              pattern: \d+
              description: Page size should usually be an integer between 10 and 50.
      - name: order
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                - id
                - date
                - customerId
                - projectId
              dir:
                type: string
                enum:
                - asc
                - desc
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        date:
                          x-description-missing: true
                          type: string
                          format: date-time
                          nullable: true
                          example: '2020-09-23T14:20:08+02:00'
                        projectId:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        type:
                          x-description-missing: true
                          type: string
                          example: RE_Beleg
                        posFunction:
                          x-description-missing: true
                          type: string
                          example: TODO
                        doctype:
                          x-description-missing: true
                          type: string
                          example: rechnung
                        paymentType:
                          x-description-missing: true
                          type: string
                          example: eckarte
                        doctypeId:
                          x-description-missing: true
                          type: number
                          example: 10
                        documentNumber:
                          x-description-missing: true
                          type: string
                          example: '400009'
                        journalText:
                          x-description-missing: true
                          type: string
                          example: RE 400009 (POS)
                        revenueAccount:
                          x-description-missing: true
                          type: string
                          example: '4400'
                        currency:
                          x-description-missing: true
                          type: string
                          example: EUR
                        tax:
                          x-description-missing: true
                          type: number
                          format: float
                          example: 16
                        amountGross:
                          x-description-missing: true
                          type: number
                          format: float
                          example: 99
                        amountNet:
                          x-description-missing: true
                          type: number
                          format: float
                          example: 85.34
                        cashRegisterId:
                          x-description-missing: true
                          type: number
                          example: 5
                        customerId:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        createdAt:
                          x-description-missing: true
                          type: string
                          format: date-time
                          example: '2020-09-23T20:22:08+02:00'
                        createdBy:
                          x-description-missing: true
                          type: string
                          example: John Doe
                        businessTransactionType:
                          x-description-missing: true
                          type: string
                          nullable: true
                          example: TODO
                        qrString:
                          x-description-missing: true
                          type: string
                          nullable: true
                          example: null
                        fiscalDocumentReference:
                          description: This field represents an object with dynamic structure
                          type: object
                          additionalProperties: true
                          nullable: true
                          example: {}
                        salesOrder:
                          x-description-missing: true
                          type: object
                          additionalProperties: false
                          nullable: true
                          required:
                          - id
                          - number
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            number:
                              type: string
                              example: '200002'
                            externalOrderNumber:
                              type: string
                              example: '152'
                          example:
                            id: '5'
                            number: '200002'
                            externalOrderNumber: '152'
