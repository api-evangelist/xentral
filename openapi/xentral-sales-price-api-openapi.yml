openapi: 3.2.0
info:
  title: Xentral Sales Price API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Sales Price
  description: SalesPrices determine the prices used in sales to customers.
paths:
  /api/v1/salesPrices:
    post:
      tags:
      - Sales Price
      operationId: salesPrice.create
      summary: Create sales price
      description: Creates new sales price
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - product
              properties:
                product:
                  description: Reference to another resource
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                validFrom:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: Sets the starting date of the sales price being valid.
                expiresAt:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: Sets the expiration date of the sales price.
                amount:
                  oneOf:
                  - type: number
                    format: float
                    description: Float or int, greater than zero
                  - type: string
                    format: float
                    description: Numeric value greater than zero
                packageAmount:
                  type:
                  - number
                  - 'null'
                  format: float
                customer:
                  description: Nullable reference to another resource
                  type:
                  - object
                  - 'null'
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                customerGroup:
                  description: Nullable reference to another resource
                  type:
                  - object
                  - 'null'
                  additionalProperties: false
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: Resource identifier.
                  example:
                    id: '1337'
                price:
                  description: Money object with amount and currency
                  example:
                    amount: '13.37'
                    currency: EUR
                  type: object
                  additionalProperties: false
                  properties:
                    amount:
                      description: A string representing the amount
                      type: string
                      format: float
                      example: '24.99'
                    currency:
                      type: string
                      pattern: '[A-Z]{3}'
                      enum:
                      - EUR
                      - USD
                      - JPY
                      - BGN
                      - CZK
                      - DKK
                      - GBP
                      - HUF
                      - PLN
                      - RON
                      - SEK
                      - CHF
                      - ISK
                      - NOK
                      - HRK
                      - RUB
                      - TRY
                      - AUD
                      - BRL
                      - CAD
                      - CNY
                      - HKD
                      - IDR
                      - ILS
                      - INR
                      - KRW
                      - MXN
                      - MYR
                      - NZD
                      - PHP
                      - SGD
                      - THB
                      - ZAR
                      - ARS
                      - CLP
                      - SAR
                      - AED
                      - QAR
                      description: Currency matches one of currency values as specified in ISO-4217.
                      example: PLN
                customerProductNumber:
                  type:
                  - string
                  - 'null'
                  default: null
                  description: Customer product number for the item.
                  example: ABC-123
                isNotCalculatedFromExchangeTable:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: Flag to indicate that this price is not calculated from the currency conversion table.
                hideInBulkPriceListing:
                  type:
                  - boolean
                  - 'null'
                  default: false
                  description: Flag to hide this sales price in listings for graduated prices and bulk price lists.
                remark:
                  type:
                  - string
                  - 'null'
                  default: ''
                  description: Internal comment for the sales price.
                  example: Remark
            examples:
              Create sales price:
                value:
                  product:
                    id: '14'
                  validFrom: '2023-12-01'
                  amount: 1
                  price:
                    amount: '24.20'
                    currency: EUR
              Create sales price with float as string for amount:
                value:
                  product:
                    id: '14'
                  validFrom: '2023-12-01'
                  amount: '10.5'
                  price:
                    amount: '24.20'
                    currency: EUR
              Create customer-specific sales price:
                value:
                  product:
                    id: '14'
                  customer:
                    id: '35'
                  amount: 10.5
                  price:
                    amount: '24.20'
                    currency: EUR
      responses:
        '201':
          description: Resource successfully created response
          headers:
            Location:
              schema:
                type: string
                example: https://example.xentral.biz/api/users/17
              description: URI of the created resource
          content:
            text/html:
              schema:
                type:
                - string
                - 'null'
                enum:
                - ''
        '400':
          description: IETF RFC 9457 Problem API compliant response
          content:
            application/problem+json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - violations
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/request-validation
                    title:
                      type: string
                      minLength: 1
                      example: Request payload validation failed.
                    violations:
                      oneOf:
                      - type: array
                        items:
                          type: object
                          example:
                            username:
                            - This value should not be blank.
                            email:
                            - This value is not a valid email address.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                      - type: object
                        example:
                          _:
                          - This value should contain at most `9` elements.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/generic-validation
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/conflict
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - items
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/conflictItems
                    title:
                      type: string
                      minLength: 1
                    items:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - title
                        - messages
                        properties:
                          id:
                            type: integer
                          title:
                            type: string
                            minLength: 1
                          messages:
                            type: array
                            items:
                              type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - scopes
                  properties:
                    type:
                      type: string
                      enum:
                      - https://developer.xentral.com/reference/problems#token-scopes
                    title:
                      type: string
                      minLength: 1
                    scopes:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/generic-validation
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
        '401':
          description: Unable to authenticate the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message explaining why the request failed.
                    example: 'Missing required scopes: customer:create.'
              example:
                message: 'Missing required scopes: customer:create.'
            text/html:
              schema:
                type: string
                example: Unauthorized
        '403':
          description: IETF RFC 9457 Problem API compliant response
          content:
            application/problem+json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - violations
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/request-validation
                    title:
                      type: string
                      minLength: 1
                      example: Request payload validation failed.
                    violations:
                      oneOf:
                      - type: array
                        items:
                          type: object
                          example:
                            username:
                            - This value should not be blank.
                            email:
                            - This value is not a valid email address.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                      - type: object
                        example:
                          _:
                          - This value should contain at most `9` elements.
                        description: This field will be a mirrored request payload with only invalid fields and values replaced by error messages.
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/generic-validation
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/conflict
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - items
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/conflictItems
                    title:
                      type: string
                      minLength: 1
                    items:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - title
                        - messages
                        properties:
                          id:
                            type: integer
                          title:
                            type: string
                            minLength: 1
                          messages:
                            type: array
                            items:
                              type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - scopes
                  properties:
                    type:
                      type: string
                      enum:
                      - https://developer.xentral.com/reference/problems#token-scopes
                    title:
                      type: string
                      minLength: 1
                    scopes:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - type
                  - title
                  - messages
                  properties:
                    type:
                      type: string
                      enum:
                      - https://api.xentral.biz/problems/generic-validation
                    title:
                      type: string
                      minLength: 1
                    messages:
                      type: object
                      additionalProperties:
                        type: array
                        items:
