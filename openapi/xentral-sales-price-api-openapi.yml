        '415':
          description: Resource representation send in the request is not supported.
        '429':
          description: Too many API calls made.
    get:
      tags:
      - Sales Price
      operationId: salesPrice.list
      summary: List sales prices
      description: Returns list of a sales prices
      parameters:
      - name: filter
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                enum:
                - id
                - productId
                - customerId
                - groupId
                - currency
                - amount
                - isValidAt
                - targetCountry
                - validFrom
                - expiresAt
              op:
                type: string
                enum:
                - equals
                - notEquals
                - in
                - notIn
                - exactlyIn
                - allIn
                - allNotIn
                - contains
                - notContains
                - startsWith
                - endsWith
                - greaterThan
                - lessThan
                - is
                - lessThanOrEquals
                - greaterThanOrEquals
              value:
                oneOf:
                - type: string
                  description: Used for the operations 'equals', 'notEquals', 'contains', 'notContains', 'startsWith', 'endsWith' and 'is'.
                  title: String
                - type: array
                  description: Used for the operations 'in', 'notIn', 'exactlyIn', 'allIn' and 'allNotIn'.
                  title: Array
                  items:
                    type: string
      - in: query
        name: page
        required: false
        style: deepObject
        schema:
          type: object
          additionalProperties: false
          required:
          - number
          - size
          properties:
            number:
              type: string
              pattern: \d+
              description: Page number should be an integer greater than or equal to 1
            size:
              type: string
              pattern: \d+
              description: Page size should usually be an integer between 10 and 50.
      - name: order
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                - id
                - price
                - amount
              dir:
                type: string
                enum:
                - asc
                - desc
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      x-description-missing: true
                      example:
                        id: '1'
                        product:
                          id: '12'
                        customer: null
                        customerGroup: null
                        amount: 1
                        packageAmount: null
                        price:
                          amount: '62.00000000'
                          currency: EUR
                          amountGross: '73.78000000'
                          taxRate:
                            rate: '19.00'
                            type: normal
                            source: project tax rate
                        validFrom: null
                        expiresAt: null
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        product:
                          description: Reference to another resource
                          type: object
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                          example:
                            id: '1337'
                        validFrom:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Shows the starting date of the sales price being valid.
                          example: '2023-01-01'
                        expiresAt:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Shows the expiration date of the sales price.
                          example: '2023-01-01'
                        amount:
                          type: number
                          format: float
                          description: Amount of the product required for the sales price.
                          example: 3
                        packageAmount:
                          x-description-missing: true
                          type:
                          - number
                          - 'null'
                          format: float
                          example: 3
                        customer:
                          description: Nullable reference to another resource
                          type:
                          - object
                          - 'null'
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                          example:
                            id: '1337'
                        customerGroup:
                          description: Nullable reference to another resource
                          type:
                          - object
                          - 'null'
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                          example:
                            id: '1337'
                        price:
                          description: Price object with amount, amount gross, currency and tax rate
                          type: object
                          additionalProperties: false
                          example:
                            amount: '24.20'
                            amountGross: '28.80'
                            currency: EUR
                            taxRate:
                              rate: '19.00'
                              type: normal
                              source: project tax rate
                          properties:
                            amount:
                              type: string
                              format: float
                            amountGross:
                              type:
                              - string
                              - 'null'
                              format: float
                            currency:
                              type: string
                              pattern: '[A-Z]{3}'
                              enum:
                              - EUR
                              - PLN
                              - CHF
                              - USD
                              - GBP
                              description: Currency matches one of currency values as specified in ISO-4217.
                            taxRate:
                              type:
                              - object
                              - 'null'
                              additionalProperties: false
                              properties:
                                rate:
                                  type: string
                                  format: float
                                type:
                                  type: string
                                source:
                                  type: string
                        customerProductNumber:
                          type:
                          - string
                          - 'null'
                          default: null
                          description: Customer product number for the item.
                          example: ABC-12345
                        isNotCalculatedFromExchangeTable:
                          type: boolean
                          default: false
                          description: Flag to indicate that this price is not calculated from the currency conversion table.
                          example: true
                        hideInBulkPriceListing:
                          type: boolean
                          default: false
                          description: Flag to indicate that this price should be hidden in bulk price listings.
                          example: false
                        remark:
                          type: string
                          default: ''
                          description: Internal comment for the sales price.
                          example: Special remark
                  extra:
                    type: object
                    required:
                    - totalCount
                    - page
                    additionalProperties: false
                    x-description-ignore: true
                    properties:
                      totalCount:
                        description: the total count of all items
                        type: integer
                        example: 1
                      page:
                        description: The pagination object containing the current page number and size
                        type: object
                        required:
                        - number
                        - size
                        additionalProperties: false
                        properties:
                          number:
                            description: The current page number
                            type: integer
                            example: 1
                          size:
                            description: The size of the pages
                            type: integer
                            example: 10
                        example:
                          number: 1
                          size: 10
                    example:
                      totalCount: 1
                      page:
                        number: 1
                        size: 10
              examples:
                Lists all sales prices:
                  value:
                    data:
                    - id: '1'
                      product:
                        id: '12'
                      customer: null
                      customerGroup: null
                      amount: 1
                      packageAmount: null
                      price:
                        amount: '62.00000000'
                        currency: EUR
                        amountGross: '73.78000000'
                        taxRate:
                          rate: '19.00'
                          type: normal
                          source: project tax rate
                      validFrom: null
                      expiresAt: null
                    - id: '2'
                      product:
                        id: '1'
                      customer:
                        id: '7'
                      customerGroup: null
                      amount: 1
                      packageAmount: null
                      price:
                        amount: '0.16000000'
                        currency: EUR
                        amountGross: '0.17120000'
                        taxRate:
                          rate: '7.00'
                          type: reduced
                          source: project tax rate
                      validFrom: '2024-04-01'
                      expiresAt: '2024-04-30'
                    extra:
                      totalCount: 2
                      page:
                        number: 1
                        size: 10
        '401':
          description: Unable to authenticate the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message explaining why the request failed.
                    example: 'Missing required scopes: customer:create.'
              example:
                message: 'Missing required scopes: customer:create.'
            text/html:
              schema:
                type: string
                example: Unauthorized
        '403':
          description: Unable to authorize the client
        '406':
          description: Requested resource representation does not exist.
        '429':
          description: Too many API calls made.
