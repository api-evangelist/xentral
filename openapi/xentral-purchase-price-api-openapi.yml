                          id: '5'
                        supplier:
                          id: '7'
                        isStandardSupplier: false
                        supplierDesignation: '123456'
                        fromQuantity: 1
                        packageAmount: 1
                        price:
                          amount: 12.92
                          currency: EUR
                        validFrom: null
