                                zipCode:
                                  type: string
                                city:
                                  type: string
                                fax:
                                  type: string
                                state:
                                  type: string
                                country:
                                  type: string
                                addressSupplement:
                                  type: string
                                gln:
                                  type: string
                                phoneNumber:
                                  type: string
                                mobile:
                                  type: string
