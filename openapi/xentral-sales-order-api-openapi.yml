                  type: boolean
                  description: Flag indicating whether a calendar week should be printed on documents
                editor:
                  type: string
                  description: Creator of the Sales Order
                salesRepresentative:
                  description: Reference to the sales representative resource.
                  type: object
                  required:
                  - id
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: The string Id
