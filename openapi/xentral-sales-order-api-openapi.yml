                                number: '1234'
                            billingAddress:
                              type: object
                              additionalProperties: false
                              required:
                              - name
                              - country
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - mr
                                  - mrs
                                  - company
                                  - other
                                name:
                                  type: string
                                title:
                                  type: string
                                contactPerson:
                                  type: string
                                department:
                                  type: string
                                subDepartment:
                                  type: string
                                street:
