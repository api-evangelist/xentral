                          example: Administrator1
                        sales:
                          type: object
                          description: Represents a sales representative with associated attributes.
                          additionalProperties: false
                          properties:
                            id:
                              type:
                              - number
                              - 'null'
                            name:
                              type:
                              - string
                              - 'null'
