                          format: date
                          example: '2023-08-13'
                        earliestFulfillmentDate:
                          description: Earliest Fulfillment Date
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2023-08-13'
                        reservationDate:
                          description: Reservation Date for the Sales Order
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2023-08-13'
                        desiredDeliveryDateAsCalendarWeek:
                          type: boolean
