    patch:
      tags:
      - Sales Order
      operationId: salesOrder.update
      summary: Update sales order
      description: 'CAUTION: Positions not specified in the payload will be DELETED. Please pass the ids along if you need them to be preserved.


        The sales order edit endpoint allows for updating an existing sales order. When updating, any positions not included in the positions payload will be implicitly deleted from the order. This ensures that the positions list in the payload accurately reflects the desired state of the sales order after the update.'
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      requestBody:
        description: Sales order edit request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                date:
                  type: string
                  format: date
                earliestFulfillmentDate:
                  type:
                  - string
                  - 'null'
                  format: date
                desiredDeliveryDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The desired delivery date for the sales order. Format: Y-m-d'
                  example: '2022-12-05'
                reservationDate:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: 'The reservation date for the sales order. Format: Y-m-d'
                  example: '2022-12-05'
                desiredDeliveryDateAsCalendarWeek:
                  type: boolean
                  description: Flag indicating whether a calendar week should be printed on documents
                editor:
                  type: string
                  description: Creator of the Sales Order
                salesRepresentative:
                  description: Reference to the sales representative resource.
                  type: object
                  required:
                  - id
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      pattern: \d+
                      example: '17'
                      description: The string Id
                  example:
                    id: '123'
                externalOrderNumber:
                  type: string
                  description: Customer-facing sales order number in the originating shop system / platform (e.g. Shopify, Amazon, etc)
                externalOrderId:
                  type: string
                  description: technical sales order ID in the originating shop system / platform (e.g. Shopify, Amazon, etc). This ID is used to sync status updates & tracking info back to the originating shop / platform
                transactionNumber:
                  type: string
                  description: transaction number typically used to identify payment transactions in the originating shop system / platforms (e.g. Shopify, Amazon, etc). This ID is typically used for financial reconciliation of payment transactions with sales orders / invoices in Xentral.
                customerOrderNumber:
                  type: string
                  description: Purchase Order number from the customer’s purchase order system, typically used in B2B context.
                autoCreateDocuments:
                  type: string
                  enum:
                  - deliveryNote+invoice
                  - deliveryNote
                  - invoice
