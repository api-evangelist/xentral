openapi: 3.0.0
info:
  title: Xentral Account Sales Order API
  version: v0.1
  description: Xentral is an ERP platform.
  contact:
    name: Xentral
    url: https://xentral.com
    email: api@xentral.com
servers:
- url: https://{xentralId}.xentral.biz
  description: Your Xentral Instance
  variables:
    xentralId:
      default: xentral
- url: https://{domain}
  description: Xentral at a custom domain
  variables:
    domain:
      default: xentral.com
security:
- BearerAuth: []
tags:
- name: Sales Order
  description: SalesOrders are an outbound orders, meaning that someone has bought from you.
paths:
  /api/v1/salesOrders:
    get:
      tags:
      - Sales Order
      operationId: salesOrder.list
      summary: List sales orders
      description: Returns a collection with all sales orders.
      parameters:
      - in: query
        name: page
        required: false
        style: deepObject
        schema:
          type: object
          additionalProperties: false
          required:
          - number
          - size
          properties:
            number:
              type: string
              pattern: \d+
              description: Page number should be an integer greater than or equal to 1
            size:
              type: string
              pattern: \d+
              description: Page size should usually be an integer between 10 and 50.
      - name: order
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                - id
                - documentNumber
              dir:
                type: string
                enum:
                - asc
                - desc
      - name: filter
        in: query
        style: deepObject
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                enum:
                - orderDate
                - status
                - documentNumber
                - transactionNumber
                - externalOrderNumber
                - customerOrderNumber
                - externalOrderId
                - customerId
                - customerNumber
                - email
                - zipCode
                - shippingEmail
                - shippingZip
                - isBeingEdited
                - subsequentDelivery
                - shippingDateOk
                - creditLimitOk
                - shippingLockOk
                - prepaidOk
                - postageOk
                - customerCheckOk
                - vatOk
                - stockOk
                - internalComment
                - shippingMethod
                - autoShipping
                - fastLane
                - gln
                - shippingGln
                - project
                - paymentMethod
                - country
                - phoneNumber
                - shippingCountry
                - desiredDeliveryDate
                - earliestFulfillmentDate
                - createdAt
                - updatedAt
              op:
                type: string
                enum:
                - greaterThan
                - lessThan
                - greaterThanOrEquals
                - lessThanOrEquals
                - equals
                - notEquals
                - in
                - notIn
              value:
                oneOf:
                - type: string
                  description: 'For dates use format: 2023-01-26T10:42:42+01:00 and encode as url. Valid statuses are created,released,canceled,completed.'
                  title: String
                - type: array
                  description: Used for the operations 'in', 'notIn', 'exactlyIn', 'allIn' and 'allNotIn'.
                  title: Array
                  items:
                    type: string
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          pattern: \d+
                          example: '17'
                          description: Resource identifier.
                        documentNumber:
                          type: string
                          description: Internal identification associated with a Sales Order
                          example: SO-1234
                        isBeingEdited:
                          type: boolean
                          description: Indicates if the Sales Order is currently being edited
                          example: false
                        shippingDateOk:
                          type: boolean
                          description: Indicates if the shipping date is ok
                          example: false
                        creditLimitOk:
                          type: boolean
                          description: Indicates if the credit limit is ok
                          example: false
                        subsequentDelivery:
                          type: boolean
                          description: Indicates if the Sales Order is a subsequent delivery
                          example: false
                        shippingLockOk:
                          type: boolean
                          description: Indicates if the shipping lock is ok
                          example: false
                        postageOk:
                          type: boolean
                          description: Indicates if the postage is ok
                          example: false
                        customerCheckOk:
                          type: boolean
                          description: Indicates if the customer check is ok
                          example: false
                        vatOk:
                          type: boolean
                          description: Indicates if the VAT is ok
                          example: false
                        stockOk:
                          type: boolean
                          description: Indicates if the stock is ok
                          example: false
                        prepaidOk:
                          type: boolean
                          description: Indicates if the prepaid status is ok
                          example: false
                        externalOrderNumber:
                          type: string
                          description: External identification associated with a Sales Order
                          example: ESO-1234
                        transactionNumber:
                          type: string
                          description: Transaction number associated with a Sales Order
                          example: transaction1
                        customerOrderNumber:
                          type: string
                          description: Customer order associated with a Sales Order
                          example: customerOrder1
                        externalOrderId:
                          type: string
                          description: External ID associated with a Sales Order
                          example: '10'
                        bodyOutroduction:
                          type: string
                          description: Ending description message for Sales Order
                          example: Additional info
                        date:
                          description: a yyyy-mm-dd formatted date
                          type: string
                          format: date
                          example: '2023-08-13'
                        netSales:
                          type: number
                          format: float
                          description: Net sales amount of the Sales Order
                          example: 100
                        total:
                          type: number
                          format: float
                          description: Total amount of the Sales Order
                          example: 100
                        desiredDeliveryDate:
                          description: Desired Delivery Date for the Sales Order
                          type: string
                          format: date
                          example: '2023-08-13'
                          nullable: true
                        earliestFulfillmentDate:
                          description: Earliest Fulfillment Date
                          type: string
                          format: date
                          example: '2023-08-13'
                          nullable: true
                        reservationDate:
                          description: Reservation Date for the Sales Order
                          type: string
                          format: date
                          example: '2023-08-13'
                          nullable: true
                        desiredDeliveryDateAsCalendarWeek:
                          type: boolean
                          description: Indicating whether a calendar week should be printed on documents or the actual date) is readable and editable via API
                          example: false
                        editor:
                          type: string
                          description: Creator of the Sales Order
                          example: Administrator1
                        sales:
                          type: object
                          description: Represents a sales representative with associated attributes.
                          additionalProperties: false
                          properties:
                            id:
                              type: number
                              nullable: true
                            name:
                              type: string
                              nullable: true
                          example:
                            id: 17
                            name: John Doe
                        status:
                          type: string
                          enum:
                          - completed
                          - created
                          - released
                          - canceled
                          - unknown
                          description: Status of the Sales Order
                          example: completed
                        customer:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            number:
                              type: string
                              nullable: true
                          description: Customer linked to a Sales Order
                          example:
                            id: '1'
                        comment:
                          type: string
                          description: Comment included in the Sales Order
                          example: Comment
                        project:
                          description: Reference to another resource
                          type: object
                          additionalProperties: false
                          required:
                          - id
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                          example:
                            id: '1337'
                        language:
