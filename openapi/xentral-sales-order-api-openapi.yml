    patch:
      tags:
      - Sales Order
      operationId: salesOrder.update
      summary: Update sales order
      description: '<strong>CAUTION: Positions not specified in the payload will be DELETED. Please pass the ids along if you need them to be preserved.</strong><br><br>The sales order edit endpoint allows for updating an existing sales order. When updating, any positions not included in the positions payload will be implicitly deleted from the order. This ensures that the positions list in the payload accurately reflects the desired state of the sales order after the update.'
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      requestBody:
        description: Sales order edit request payload
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                date:
                  type: string
                  format: date
                earliestFulfillmentDate:
                  type: string
                  format: date
                  nullable: true
                desiredDeliveryDate:
                  type: string
                  format: date
                  description: 'The desired delivery date for the sales order. Format: Y-m-d'
                  example: '2022-12-05'
                  nullable: true
                reservationDate:
                  type: string
                  format: date
                  description: 'The reservation date for the sales order. Format: Y-m-d'
                  example: '2022-12-05'
                  nullable: true
