  /api/v1/analytics/report/{id}/query:
    post:
      tags:
      - Report
      operationId: analytics.report.query
      summary: Execute report query
      description: Execute a stored report query synchronously and get result table. The number of records that you receive as results is limited to a reasonable amount (currently 5000 records). This endpoint is mainly for viewing the data. Use the export endpoints in order to fetch all results.
      requestBody:
        description: Report query payload
        content:
          application/json:
            schema:
              type: object
              example:
                parameters:
                - name: date
                  type: string
                  defaultValue: '2021-01-01'
              properties:
                parameters:
                  type: array
                  nullable: true
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - name
                    - type
                    - defaultValue
                    example:
                      name: date
                      type: string
                      defaultValue: '2021-01-01'
                    properties:
                      name:
                        type: string
                        description: Parameter name
                        example: date
                      type:
                        type: string
                        description: Parameter type
                        example: string
                      defaultValue:
                        type: string
                        description: Default value for parameter you want to store
                        example: '2021-01-01'
                      valueMap:
                        type: array
                        description: Array of dropdown options with label and value properties. Values will be rendered in the query, labels are displayed in the dropdown.
                        items:
                          type: object
                          required:
                          - label
                          - value
                          properties:
                            label:
                              type: string
                              description: Display label shown in the dropdown
                            value:
                              type: string
                              description: Value used in the query
                        example:
                        - label: Option 1
                          value: option1
                        - label: Option 2
                          value: option2
                settings:
                  type: object
                  nullable: true
                  additionalProperties: false
                  properties:
                    delimiter:
                      type: string
                      description: The delimiter character used for CSV or TXT exports
                      example: ','
                      minLength: 1
                      maxLength: 1
                    escapeSpecialCharacters:
                      type: boolean
                      description: Whether to escape special characters in TXT exports (e.g. quotes, newlines)
                      example: true
                      default: false
                    disableQuotes:
                      type: boolean
                      description: Whether to disable enclosing all values with double quotes in TXT exports. This is useful for handling special characters or values that contain the delimiter character. It's problematic if values contain double quotes themselves.
                      example: false
                      default: false
                    exportFormat:
                      type: string
                      description: Export format for reports
                      example: txt
                      enum:
                      - csv
                      - xlsx
                      - json
                      - txt
                      - parquet
                      - pdf
                      default: txt
                    numberFormattingMode:
                      type: string
                      description: Number formatting mode that should be applied when visualizing numbers (does not affect exports)
                      example: locale
                      enum:
                      - locale
                      - raw
                      default: raw
            examples:
              example:
                summary: Example report query payload
                value:
                  parameters:
                  - name: date
                    type: string
                    defaultValue: '2021-01-01'
      parameters:
      - in: path
        name: id
        required: true
        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      - name: preview
        in: query
        style: deepObject
        schema:
          type: object
          additionalProperties: false
          properties:
            preview:
              type: boolean
              example: false
              default: false
              description: If true, only a limited amount of records will be returned, but the request does not cost any credits. If true, all results are returned up to a max number of 500 rows.
      responses:
        '200':
          description: Query response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    description: Generic result response for a query in a table-like structure.
                    type: object
                    nullable: true
                    additionalProperties: false
                    required:
                    - header
                    - rows
                    properties:
                      header:
                        type: array
                        items:
                          type: string
                      rows:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
                    example:
                      header:
                      - id
                      - name
                      rows:
                      - - '1'
                        - Alice
                      - - '2'
                        - Bob
                  meta:
                    description: Query meta information.
                    type: object
                    additionalProperties: false
                    nullable: true
                    example:
                      query: SELECT * FROM users
                      executionTime: 0.123
                      totalResults: 2
                      columnTypes:
                      - integer
                      - string
                    properties:
                      columnTypes:
                        type: array
                        nullable: true
                        items:
                          type: string
                        description: Derived column types for each column in the result table.
                        example:
                        - integer
                        - string
                      executionTime:
                        description: Execution time of the query in seconds.
                        example: 0.123
                        type: number
                        nullable: true
                      query:
                        description: SQL query that was executed.
                        type: string
