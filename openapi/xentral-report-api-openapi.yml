                      example: My report
                    description:
                      type: string
                      description: Report description
                      example: This is my report
                    userId:
                      type: number
                      description: User ID of the report creator
                      example: 1
                    sqlString:
                      type: string
                      description: SQL query string
                      example: SELECT * FROM users
                    isFavorite:
                      type: boolean
                      description: Is report marked as favorite
                      example: true
                    isReadOnly:
                      type: boolean
                      description: Is report read-only
                      example: false
                    collectionId:
                      type: number
                      description: ID of the collection the report belongs to
                      example: 1
                    parameters:
                      type: array
                      nullable: true
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - name
                        - type
                        - defaultValue
                        example:
                          name: date
                          type: string
                          defaultValue: '2021-01-01'
                        properties:
                          name:
                            type: string
                            description: Parameter name
                            example: date
                          type:
                            type: string
                            description: Parameter type
                            example: string
                          defaultValue:
                            type: string
                            description: Default value for parameter you want to store
                            example: '2021-01-01'
                          valueMap:
                            type: array
                            description: Array of dropdown options with label and value properties. Values will be rendered in the query, labels are displayed in the dropdown.
                            items:
                              type: object
                              required:
                              - label
                              - value
                              properties:
                                label:
                                  type: string
                                  description: Display label shown in the dropdown
                                value:
                                  type: string
                                  description: Value used in the query
                            example:
                            - label: Option 1
                              value: option1
                            - label: Option 2
                              value: option2
            examples:
              example:
                summary: Example report payload
                value:
                  report:
                    title: My report
                    description: This is my report
                    userId: 1
                    sqlString: SELECT * FROM users
                    isFavorite: true
                    isReadOnly: false
                    collectionId: 1
                    parameters:
                    - name: date
                      type: string
                      defaultValue: '2021-01-01'
      responses:
        '200':
          description: Report response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: array
                    nullable: true
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - title
                      - sqlString
                      - collectionId
                      properties:
                        id:
                          type: number
                          description: Report ID
                          example: 1
                        title:
                          type: string
                          description: Report title
                          example: My report
                        description:
                          type: string
                          description: Report description
                          example: This is my report
                        userId:
                          type: number
                          description: User ID of the report creator
                          example: 1
                        sqlString:
                          type: string
                          description: SQL query string
                          example: SELECT * FROM users
                        isFavorite:
                          type: boolean
                          description: Is report marked as favorite
                          example: true
                        isReadOnly:
                          example: false
                          type: boolean
                          description: Is report read-only
                        collectionId:
                          example: 1
                          type: number
                          description: ID of the collection the report belongs to
                        lastEditedBy:
                          example: John Doe
                          type: string
                          description: User who last edited the report
                        tags:
                          type: array
                          example:
                          - id: 1
                            name: Official
                            description: This is my tag
                            palette: default
                            isOfficial: true
                            createdAt: '2023-01-01T00:00:00+00:00'
                            updatedAt: '2023-01-01T00:00:00+00:00'
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - id
                            - name
                            properties:
                              id:
                                type: number
                                description: Tag ID
                                example: 1
                              name:
                                type: string
                                description: Tag name
                                example: Official
                              description:
                                type: string
                                description: Tag description
                                example: This is my tag
                              palette:
                                type: string
                                enum:
                                - default
                                - warning
                                - success
                                - danger
                                - primary
                                description: The palette value of the tag
                                example: default
                              isOfficial:
                                type: boolean
                                description: Whether the tag is used for official Xentral reports
                                example: true
                              createdAt:
                                example: '2023-01-01T00:00:00+00:00'
                                type: string
                                format: date-time
                                description: Creation time
                              updatedAt:
                                example: '2023-01-01T00:00:00+00:00'
                                type: string
                                format: date-time
                                description: Last update time
                        parameters:
                          type: array
                          nullable: true
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            - type
                            - defaultValue
                            example:
                              name: date
                              type: string
                              defaultValue: '2021-01-01'
                            properties:
                              name:
                                type: string
                                description: Parameter name
                                example: date
                              type:
                                type: string
                                description: Parameter type
                                example: string
                              defaultValue:
                                type: string
                                description: Default value for parameter you want to store
                                example: '2021-01-01'
                              valueMap:
                                type: array
                                description: Array of dropdown options with label and value properties. Values will be rendered in the query, labels are displayed in the dropdown.
                                items:
                                  type: object
                                  required:
                                  - label
