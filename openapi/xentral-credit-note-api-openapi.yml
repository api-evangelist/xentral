  /api/v3/creditNotes/{id}:
    get:
      tags:
      - Credit Note
      summary: View credit note V3
      description: 'This endpoint requires the following scopes: `creditNote:read`.


        View a single credit note.


        **Content Negotiation:** This endpoint supports additional response formats: `application/pdf`. Use the `Accept` header to request a specific format.'
      operationId: GET::api-v3-creditnotes-id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - lineItems
            - project
            - address
            - customFields
            - lineItems.product
            - tags
            - activity
            - lineItems.customFields
      responses:
        '200':
          description: View a single credit note.
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: Credit note document
                    type: object
                    allOf:
                    - properties:
                        id:
                          description: ID of the document
                          type: string
                          example: '1'
                        documentNumber:
                          description: Document number. For drafts, this will be null.
                          type:
                          - string
                          - 'null'
                          example: I-12343
                        documentDate:
                          description: Main date of the document.
                          type:
                          - string
                          - 'null'
                          format: date
                          example: '2023-10-01'
                        writeProtection:
                          description: Indicates if the document is write protected.
                          type: boolean
                          example: false
                        customerNumber:
                          description: Customer number of the document.
                          type:
                          - string
                          - 'null'
                          example: CUST-54321
                        address:
                          description: Address entity of the document. By default, only the ID is returned. To get the full Address object, use the `include` parameter.
