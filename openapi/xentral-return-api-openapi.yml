        description: The resource's identifier.
        schema:
          type: string
          pattern: \d+
          example: '17'
          description: Resource identifier.
      responses:
        '200':
          description: One return.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - date
                    - salesOrder
                    - positions
                    properties:
                      id:
                        type: string
                        pattern: \d+
                        example: '17'
                        description: Resource identifier.
                      date:
                        type: string
                        nullable: true
                        format: date
                        example: '2023-03-16'
                        description: Date of creation of the Return order
                      status:
                        type: string
                        enum:
                        - unknown
                        - open
                        - canceled
                        - completed
                        - sent
                        - created
                        - announced
                        - released
                        - checked
                        - done
                        description: Status of the Return order
                        example: completed
                      progress:
                        type: string
                        enum:
                        - announced
                        - received
                        - checked
                        - done
                        description: Proress of the Return order
                        example: announced
                      documentNumber:
                        type: string
                        nullable: true
                        example: 2023-000001
                        description: Internal identification of the Return order
                      bodyOutroduction:
                        type: string
                        description: Free text for return note
                        example: Freitext
                      internalComment:
                        type: string
                        description: Internal comment about the return.
                        example: Internal comment
                      shippingMethod:
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                        description: Shipping method used for the return note
                        example:
                          id: 1
                      project:
                        type: object
                        additionalProperties: false
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                        description: Project of return
                        example:
                          id: 2
                          name: B2C
                      salesOrder:
                        description: Nullable reference to another resource
                        type: object
                        additionalProperties: false
                        nullable: true
                        required:
                        - id
                        properties:
                          id:
                            type: string
                            pattern: \d+
                            example: '17'
                            description: Resource identifier.
                        example:
                          id: '1337'
                      positions:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - id
                          - quantity
                          - returnReason
                          - product
                          - salesOrderPosition
                          properties:
                            id:
                              type: string
                              pattern: \d+
                              example: '17'
                              description: Resource identifier.
                            quantity:
                              type: number
                              format: double
                              example: 14.5
                            salesOrderPosition:
                              description: Nullable reference to another resource
                              type: object
                              additionalProperties: false
                              nullable: true
                              required:
                              - id
                              properties:
                                id:
                                  type: string
                                  pattern: \d+
                                  example: '17'
                                  description: Resource identifier.
                              example:
                                id: '1337'
                            product:
                              type: object
                              additionalProperties: false
                              required:
                              - id
                              - number
                              - name
                              properties:
                                id:
                                  type: string
                                  pattern: \d+
                                  example: '17'
                                  description: Resource identifier.
                                number:
                                  type: string
                                  example: SKU-700010
                                name:
                                  type: string
                                  example: Product name
                            returnReason:
                              type: object
                              required:
                              - designation
                              properties:
                                designation:
                                  type: string
                                  nullable: true
                                  example: Damaged
                        description: Items included within the Return order
                        example:
                        - id: '1'
                          quantity: 3
                          salesOrderPosition:
                            id: '1'
                          product:
                            id: '1'
                            number: SKU-700010
                            name: Product name
                          returnReason:
                            designation: Damaged
                    description: Representation of a Return order
                    example:
                      id: '1'
                      date: '2023-03-16'
                      salesOrder:
                        id: '1'
                      positions:
                      - id: '1'
                        quantity: 3
                        salesOrderPosition:
                          id: '1'
                        product:
                          id: '1'
                          number: SKU-700010
                          name: Product name
                        returnReason:
                          designation: Damaged
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unable to authenticate the client
