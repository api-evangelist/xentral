        Creates a single tax obligation.'
      requestBody:
        description: Create a tax obligation object
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - countryCode
              properties:
                countryCode:
                  type: string
                  minLength: 2
                  maxLength: 2
            examples:
              simple tax obligation:
                value:
                  countryCode: DE
      parameters:
      - in: query
        name: dryrun
        description: Whether the request will be a dry run. It will not execute the actual persistence
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        example: 'true'
        required: false
      responses:
