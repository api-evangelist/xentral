aid: xentral
name: Xentral
description: Xentral is a cloud ERP and business operations platform from Augsburg,
  Germany that helps small and mid-sized product businesses run sales orders, purchasing,
  warehousing, fulfillment, invoicing, accounting, POS, and production from one system.
  It exposes a versioned REST API (v1/v2/v3) with Personal Access Token authentication,
  a Kafka-backed event system with webhooks, an official OpenAPI specification on GitHub,
  a hosted MCP server behind its AgentOS, and a published Claude Code plugin with agent
  skills for automating the ERP.
