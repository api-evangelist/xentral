description: The Xentral API is rate limited to 100 requests per minute independent of
  the Xentral plan. The docs flag the values as provisional ("final values for rate limits
  are currently being evaluated") and exceeding the limit returns 429 Too Many Requests.
sources:
- https://developer.xentral.com/reference/rate-limiting
responseCodes:
  throttled: 429
limits:
- name: API requests
  scope: instance
  metric: requests-per-minute
  limit: 100
  notes: Plan-independent; documented as under evaluation and likely to change.
